<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Rocket Boost · Beyond Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-hidden="true"></canvas>

<div id="hud" class="hud is-hidden"><span id="hudScore">0</span></div>

<div id="overlay" class="overlay">
    <div class="panel">
        <p class="eyebrow">Beyond Arcade</p>
        <h1 id="overlayTitle">Rocket Boost</h1>
        <p id="overlayText" class="text">Lädt …</p>
        <p id="overlayScore" class="result" hidden></p>
        <button id="overlayBtn" class="cta" type="button" hidden>Start</button>
        <p id="overlayHint" class="hint" role="status" aria-live="polite"></p>
    </div>
</div>

<div id="debug" class="debug" hidden></div>

<noscript>
    <div class="noscript">Rocket Boost benötigt JavaScript.</div>
</noscript>

<script src="wasm_exec.js"></script>
<script src="game.js"></script>
</body>
</html>
